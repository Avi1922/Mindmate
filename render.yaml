services:
  - type: web
    name: mindmate-api-d0b25
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: MindMate API
      - key: API_PREFIX
        value: /api
      - key: FRONTEND_ORIGIN
        value: https://mindmate-mvp-d0b25.web.app
      - key: MAX_REQUEST_BODY_BYTES
        value: 65536
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TEXT_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
