name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Lint and format-check backend
        run: |
          python -m ruff check backend/app backend/tests
          python -m ruff format --check backend/app backend/tests

      - name: Type-check backend
        working-directory: backend
        run: python -m mypy app

      - name: Test backend with coverage
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Audit backend production dependencies
        run: python -m pip_audit -r backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run test:coverage
          npm run typecheck
          npm run lint
          npm run build
          npm run check:bundle

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev
